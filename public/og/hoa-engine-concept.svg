<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Sample Design by HOA Daddy — unofficial website concept.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#DCE9F4"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4E9D8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Abstract community silhouette: no photography, nothing to license. -->
  <g fill="#14395E" opacity="0.16">
    <rect x="80" y="330" width="150" height="220" rx="10"/>
    <rect x="250" y="290" width="120" height="260" rx="10"/>
    <rect x="390" y="360" width="110" height="190" rx="10"/>
  </g>
  <path d="M0 550 H1200 V630 H0 Z" fill="#14395E" opacity="0.22"/>
  <g stroke="#14395E" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.28">
    <path d="M120 590 q50 -18 100 0 t100 0 t100 0"/>
    <path d="M700 590 q50 -18 100 0 t100 0 t100 0"/>
  </g>
  <circle cx="960" cy="170" r="80" fill="#B98F55" opacity="0.45"/>

  <text x="80" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#57687D" letter-spacing="4">HOA ENGINE</text>
  <text x="80" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="bold" fill="#12233A">Sample Design by HOA Daddy</text>
  <text x="80" y="292" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#33465E">Unofficial concept. Not affiliated with or endorsed by the association.</text>
</svg>
